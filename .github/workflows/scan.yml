name: MEXC 4H Squeeze Scanner

on:
  schedule:
    - cron: "5 */2 * * *"     # every 2 hours at minute 5 (UTC)
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: mexc-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save alert history
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add alerts_state.json || true
          git diff --staged --quiet || (git commit -m "update alert history" && git push)
