name: MEXC EMA Rejection Bot
on:
  schedule:
    # Runs every 4h + daily - covers 4h,8h,12h,1d,3d,5d,7d latest closed candle
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt pandas requests matplotlib pytz
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
